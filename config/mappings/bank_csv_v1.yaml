
mapping:
  mapping_id: bank_csv_v1
  mapping_version: "1.0"
  source_name: BANK
  source_type: FILE
  description: Standard bank statement CSV mapping

  # Naive timestamps remain invalid until a source timezone
  # is explicitly configured.
  source_timezone: null

  # Bank records use a positive amount and a separate
  # debit/credit direction field.
  amount_handling: positive_with_separate_direction

required_fields:
  - transaction_date
  - amount
  - currency
  - transaction_type
  - status

field_mappings:
  source_transaction_id: transaction_id
  source_account_id: account_id
  transaction_date: transaction_date
  amount: amount
  currency: currency
  transaction_type: transaction_type
  direction: direction
  payment_method: payment_method
  status: status
  description: description
  counterparty: counterparty
  fee_amount: fee
  account_balance: balance
  customer_id: customer_id

value_mappings:
  direction:
    DEBIT: DEBIT
    CREDIT: CREDIT
    DR: DEBIT
    CR: CREDIT

  transaction_type:
    PAYMENT: PAYMENT
    DEPOSIT: DEPOSIT
    WITHDRAWAL: WITHDRAWAL
    TRANSFER: TRANSFER
    REFUND: REFUND
    FEE: FEE
    REVERSAL: REVERSAL

  status:
    INITIATED: INITIATED
    PENDING: PENDING
    COMPLETED: COMPLETED
    FAILED: FAILED
    REVERSED: REVERSED

transformations:
  transaction_date: normalize_datetime
  amount: normalize_amount
  currency: normalize_currency
  transaction_type: normalize_transaction_type
  direction: normalize_direction
  payment_method: normalize_payment_method
  status: normalize_status
  fee_amount: normalize_optional_amount
  account_balance: normalize_optional_amount
