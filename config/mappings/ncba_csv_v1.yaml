
mapping:
  mapping_id: ncba_csv_v1
  mapping_version: "1.0"
  source_name: BANK
  source_type: FILE
  description: NCBA Bank statement CSV mapping
  source_timezone: Africa/Nairobi
  date_format: "%Y-%m-%d"
  amount_handling: separate_debit_credit

required_fields:
  - Date
  - Narration

field_mappings:
  transaction_date: Date
  description: Narration
  account_balance: Balance

amount_fields:
  debit: Debits
  credit: Credits

default_values:
  currency: KES
  status: COMPLETED

derived_fields:
  transaction_type:
    source_field: Narration
    rules:
      - contains: SALARY CREDIT
        value: DEPOSIT
      - contains: CARD PURCHASE
        value: PAYMENT
      - contains: PESALINK TRANSFER
        value: TRANSFER
      - contains: INWARD TRANSFER
        value: TRANSFER
      - contains: SERVICE CHARGE
        value: FEE

transformations:
  transaction_date: normalize_datetime
  currency: normalize_currency
  transaction_type: normalize_transaction_type
  status: normalize_status
  account_balance: normalize_optional_amount
