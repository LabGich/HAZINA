
mapping:
  mapping_id: utilly_bank_v1
  mapping_version: "1.0"
  source_name: UTILLY
  source_type: FILE
  description: Utilly fictional bank statement CSV mapping
  source_timezone: America/Chicago
  date_format: "%m/%d/%Y"
  amount_handling: separate_debit_credit

required_fields:
  - Date
  - Description
  - Balance
  - account_id

field_mappings:
  source_account_id: account_id
  transaction_date: Date
  description: Description
  account_balance: Balance

amount_fields:
  debit: Debit
  credit: Credit

default_values:
  currency: USD
  payment_method: OTHER
  status: COMPLETED

derived_fields:
  transaction_type:
    source_field: Description
    rules:
      - contains: MONTHLY SERVICE FEE
        value: FEE
      - contains: ONLINE TRANSFER TO SAVINGS
        value: TRANSFER
      - contains: STRIPE TRANSFER
        value: DEPOSIT
      - contains: MOBILE DEPOSIT
        value: DEPOSIT
      - contains: ZELLE FROM
        value: DEPOSIT
      - contains: WIRE TRANSFER IN
        value: DEPOSIT
      - contains: INTEREST PAYMENT
        value: DEPOSIT
      - contains: ACH DEBIT
        value: PAYMENT
      - contains: CHECK
        value: PAYMENT
      - contains: POS PURCHASE
        value: PAYMENT

transformations:
  transaction_date: normalize_datetime
  currency: normalize_currency
  transaction_type: normalize_transaction_type
  payment_method: normalize_payment_method
  status: normalize_status
  account_balance: normalize_optional_amount
