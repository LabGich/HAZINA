sources:
  BANK:
    source_type: FILE
    source_identifier: bank_statement
    description: Bank statement transaction files
    enabled: true
    supported_formats:
      - CSV
      - XLSX
      - JSON
    default_mapping:
      mapping_id: bank_csv_v1
      mapping_version: "1.0"

  MPESA:
    source_type: FILE
    source_identifier: mpesa_statement
    description: M-Pesa transaction statement files
    enabled: true
    supported_formats:
      - CSV
      - XLSX
      - JSON
    default_mapping:
      mapping_id: mpesa_csv_v1
      mapping_version: "1.0"

  STRIPE:
    source_type: API
    source_identifier: stripe
    description: Stripe payment transactions and events
    enabled: true
    supported_formats:
      - JSON
    default_mapping:
      mapping_id: stripe_api_v1
      mapping_version: "1.0"

  PLAID:
    source_type: API
    source_identifier: plaid
    description: Plaid financial account transactions
    enabled: true
    supported_formats:
      - JSON
    default_mapping:
      mapping_id: plaid_api_v1
      mapping_version: "1.0"

  DARAJA:
    source_type: API
    source_identifier: safaricom_daraja
    description: Safaricom Daraja transaction data
    enabled: true
    supported_formats:
      - JSON
    default_mapping:
      mapping_id: daraja_api_v1
      mapping_version: "1.0"

  EXPLORE_MY_DATA:
    source_type: FILE
    source_identifier: explore_my_data_bank_transactions
    description: Explore My Data synthetic bank transactions dataset
    enabled: true
    supported_formats: [CSV, XLSX, JSON, JSONL, PARQUET]
    default_mapping:
      mapping_id: explore_my_data_v1
      mapping_version: "1.0"

  #requires an adapter since its actual format requires special preprocessing
  UTILLY:
    source_type: FILE
    source_identifier: utilly_bank_statement
    description: Utilly fictional bank statement sample
    enabled: true
    supported_formats:
      - CSV
    default_mapping:
      mapping_id: utilly_bank_v1
      mapping_version: "1.0"
    ingestion:
      adapter: utilly_statement
      reader_options:
        header_row: 3
        encoding: utf-8-sig